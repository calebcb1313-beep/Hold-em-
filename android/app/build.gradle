plugins { id 'com.android.application' }

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps.getProperty('storeFile')

android {
    namespace 'app.holdem'
    compileSdk 34
    defaultConfig {
        applicationId 'app.holdem.poker'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '2.3'
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
