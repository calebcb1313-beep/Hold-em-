<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" preserveAspectRatio="none">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2b"/>
      <stop offset=".45" stop-color="#4a3120"/>
      <stop offset="1" stop-color="#2a1a0f"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3f27"/>
      <stop offset=".5" stop-color="#3a2717"/>
      <stop offset="1" stop-color="#1f140b"/>
    </linearGradient>
    <radialGradient id="felt" cx=".5" cy=".36" r=".78">
      <stop offset="0" stop-color="#2a8a63"/>
      <stop offset=".38" stop-color="#17714f"/>
      <stop offset=".72" stop-color="#0d4b36"/>
      <stop offset="1" stop-color="#06281d"/>
    </radialGradient>
    <radialGradient id="pool" cx=".5" cy=".1" r=".7">
      <stop offset="0" stop-color="#ffe2ad" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffe2ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".72">
      <stop offset=".62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </radialGradient>
    <pattern id="damask" width="120" height="104" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#dff3e6" stroke-opacity=".16" stroke-width="1.1">
        <path d="M60 8c9 12 9 22 0 34-9-12-9-22 0-34z"/>
        <path d="M60 42c14 4 22 12 22 24-12-2-20-10-22-24z"/>
        <path d="M60 42c-14 4-22 12-22 24 12-2 20-10 22-24z"/>
        <circle cx="60" cy="86" r="4"/>
      </g>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <path id="arcTop" d="M300 250 A320 200 0 0 1 900 250"/>
    <path id="arcBot" d="M330 540 A310 190 0 0 0 870 540"/>
  </defs>

  <ellipse cx="600" cy="380" rx="596" ry="376" fill="url(#wood)"/>
  <ellipse cx="600" cy="380" rx="596" ry="376" fill="none" stroke="#1a1009" stroke-width="6"/>
  <g stroke="#2a1b10" stroke-width="2" opacity=".55">
    <ellipse cx="600" cy="380" rx="580" ry="362" fill="none"/>
    <ellipse cx="600" cy="380" rx="566" ry="350" fill="none"/>
  </g>

  <ellipse cx="600" cy="380" rx="552" ry="340" fill="url(#rail)"/>
  <ellipse cx="600" cy="380" rx="552" ry="340" fill="none" stroke="#c9a15c" stroke-opacity=".45" stroke-width="2"/>
  <ellipse cx="600" cy="380" rx="530" ry="322" fill="none" stroke="#c9a15c" stroke-opacity=".55"
           stroke-width="7" stroke-dasharray="2 30" stroke-linecap="round"/>
  <ellipse cx="600" cy="380" rx="516" ry="312" fill="none" stroke="#e6cf9f" stroke-opacity=".22"
           stroke-width="1.5" stroke-dasharray="7 9"/>

  <ellipse cx="600" cy="380" rx="500" ry="298" fill="url(#felt)"/>
  <ellipse cx="600" cy="380" rx="500" ry="298" fill="url(#damask)"/>
  <ellipse cx="600" cy="380" rx="500" ry="298" fill="url(#pool)"/>

  <g fill="none" stroke="#e9d3a0">
    <ellipse cx="600" cy="380" rx="468" ry="272" stroke-opacity=".38" stroke-width="2" stroke-dasharray="3 10"/>
    <ellipse cx="600" cy="380" rx="452" ry="260" stroke-opacity=".24" stroke-width="1.4"/>
    <ellipse cx="600" cy="380" rx="424" ry="240" stroke-opacity=".12" stroke-width="1"/>
  </g>

  <g fill="#f0dcae" opacity=".5" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="26" letter-spacing="10" text-anchor="middle">
      <textPath href="#arcTop" startOffset="50%">HOLD 'EM ROYALE</textPath>
    </text>
    <text font-size="12" letter-spacing="6" text-anchor="middle" opacity=".7">
      <textPath href="#arcBot" startOffset="50%">SALOON &#183; EST. 1887</textPath>
    </text>
  </g>

  <g transform="translate(600 386)" fill="none" stroke="#f0dcae" stroke-opacity=".3">
    <path d="M-150 0h96M54 0h96" stroke-width="1"/>
    <path d="M-54 0l10-8 10 8-10 8zM54 0l-10-8-10 8 10 8z" fill="#f0dcae" fill-opacity=".28" stroke="none"/>
  </g>
  <g transform="translate(600 372)">
    <path d="M0-64c26 30 46 52 46 74 0 24-21 42-46 42s-46-18-46-42c0-22 20-44 46-74z"
          fill="#e9d3a0" fill-opacity=".14" stroke="#f0dcae" stroke-opacity=".38" stroke-width="2"/>
    <path d="M0 52v18M-14 70h28" stroke="#f0dcae" stroke-opacity=".3" stroke-width="2"/>
  </g>

  <g stroke="#f0dcae" stroke-opacity=".16" fill="none" stroke-width="1.6">
    <path d="M150 176c22-18 46-18 62-4M1050 176c-22-18-46-18-62-4"/>
    <path d="M150 584c22 18 46 18 62 4M1050 584c-22 18-46 18-62 4"/>
  </g>

  <ellipse cx="600" cy="380" rx="500" ry="298" fill="url(#vig)"/>
  <ellipse cx="600" cy="380" rx="596" ry="376" fill="#fff" opacity=".045" filter="url(#grain)"/>
</svg>
