name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: set these repository secrets to also build and release a signed APK.
      #   RELEASE_KEYSTORE_BASE64  (base64 -w0 of your .keystore)
      #   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changelog can diff against the previous release tag.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read app version
        id: ver
        run: echo "name=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build release notes
        run: |
          VER="${{ steps.ver.outputs.name }}"
          # Skip a tag for the version being built so re-running a release still
          # lists everything since the previous version.
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^v${VER}$" | head -1)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## What's new in ${VER}"
            echo
            if [ -n "$PREV" ]; then echo "Changes since ${PREV}:"; else echo "Highlights from this release:"; fi
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s' | head -30
            echo
            echo
            if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
              echo "Signed release build. Install the APK, or upload the AAB to Play Console."
            else
              echo "Preview build, debug-signed by CI. Add the release signing secrets to publish a signed APK and AAB."
            fi
          } > release-notes.md
          cat release-notes.md
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
      - name: Sync web assets into the app
        run: bash tools/sync-web.sh
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      # A signed APK checked in under releases/ is attached to the release even
      # when the signing secrets are not configured on the repository.
      - name: Collect signed APK
        run: |
          VER="${{ steps.ver.outputs.name }}"
          if [ -f "releases/holdem-royale-${VER}.apk" ]; then
            echo "SIGNED_APK=releases/holdem-royale-${VER}.apk" >> "$GITHUB_ENV"
            echo "Attaching signed APK: releases/holdem-royale-${VER}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: holdem-royale-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK and AAB
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > android/keystore.properties
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        with:
          name: holdem-royale-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish signed release
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Hold'em Royale ${{ steps.ver.outputs.name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      # No signing secrets yet: still publish an installable preview build.
      - name: Publish preview release
        if: env.RELEASE_KEYSTORE_BASE64 == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Hold'em Royale ${{ steps.ver.outputs.name }}
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.SIGNED_APK }}
