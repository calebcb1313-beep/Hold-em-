name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: set these repository secrets to also build and release a signed APK.
      #   RELEASE_KEYSTORE_BASE64  (base64 -w0 of your .keystore)
      #   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read app version
        id: ver
        run: echo "name=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)" >> "$GITHUB_OUTPUT"
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
      - name: Sync web assets into the app
        run: bash tools/sync-web.sh
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: holdem-royale-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK and AAB
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > android/keystore.properties
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        with:
          name: holdem-royale-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish signed release
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Hold'em Royale ${{ steps.ver.outputs.name }}
          body: |
            Signed release build of Hold'em Royale ${{ steps.ver.outputs.name }}.
            Install `holdem-royale-${{ steps.ver.outputs.name }}.apk`, or upload the AAB to Play Console.
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      # No signing secrets yet: still publish an installable preview build.
      - name: Publish preview release
        if: env.RELEASE_KEYSTORE_BASE64 == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Hold'em Royale ${{ steps.ver.outputs.name }}
          body: |
            Preview build of Hold'em Royale ${{ steps.ver.outputs.name }}, debug-signed by CI.
            Add the release signing secrets to this repository and the next push will
            publish a properly signed APK and AAB instead.
          files: android/app/build/outputs/apk/debug/app-debug.apk
